- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: [ "mongodb", "redis", "mysql", "user", "cart", "frontend", "rabbitmq", "catalogue", "shipping", "payment" ]
    image_id: ami-0220d79f3f480ecf5
    domain_name: manikumar.online
    action: create
 
  tasks:
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        image_id: "{{ image_id }}"
        security_groups:
          - "roboshop-{{ item }}"
          - roboshop-commongroup
        name: "roboshop-{{ item }}"
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"
 
    - name: create route53 record for root domain (points to frontend)
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item == "frontend"
 
    - name: create route53 record 
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item == "frontend"
 
    - name: delete route53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
        ttl: 1
      loop: "{{ instances }}"
      when: action == "delete"
 
    - name: delete EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        wait: false
        region: us-east-1
      loop: "{{ instances }}"
      when: action == "delete"
    
    

    

    
  

  
  
    


    
    
    
    


    
    
    
    
    
      
    



    
    


     

