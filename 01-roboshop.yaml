- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: [ "mongodb", "redis", "mysql" ,"user", "cart", "frontend" ]
    image_id: ami-0220d79f3f480ecf5
    domain_name: manikumar.online

  tasks: 
  - name: create ec2 instances
    amazon.aws.ec2_instance:
     instance_type: t3.micro
     image_id: "{{ image_id }}"
     security_groups:
            - "roboshop-{{ item }}"
            - roboshop-commongroup
     name: "roboshop-{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"
     
    

  # - name: print ec2_instance
  #   ansible.builtin.debug:
  #     msg: "{{ ec2_output }}"

  # - name: create route53 records
  #   debug:
  #     msg: "Instance Name: {{ item.item }} PrivateIP: {{ item.instances[0].private_ip_address }}"
  #   loop: "{{ ec2_output.results }}"  

  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:  action == "create"

    

  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:  action == "create"

  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:  
    - item.item == "frontend"
    - action == "create"


  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:  
    - item.item == "frontend"
    - action == "create"  

  - name: delete route53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      type: A
      ttl: 1
    loop: "{{ instances }}" 
    when: action == "delete" 

  - name: delete route53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      type: A
      ttl: 1
    loop: "{{ instances }}" 
    when: 
    - action = "delete"
    - item == "frontend"


    
    
    
    


    
    
    
    
    
      
    



    
    


     

