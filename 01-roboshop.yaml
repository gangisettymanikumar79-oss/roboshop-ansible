- name: demo on ec2 instance
  hosts: local
  connection: local
  vars:
  -  name: create ec2 instance
     instance: [ "mongodb, redis, rabbitma" ]
  tasks:
  - name: create ec2_instance
    amazon.aws.ec2_instance:
    instance_type: t3.micro
    security_groups: 
     - "roboshop-{{ item }}"
     - roboshop-commongroup
    image_id: ami-0220d79f3f480ecf5
    name: "roboshop-{{ image_id }}"
    loops: "{{ instance }}"
    register: ec2_instance


  tasks:
  - name: print output
    debug:
      msg : ec2_instance -output
    
     

