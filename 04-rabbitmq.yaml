- name: configuration rabbitmq  server
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copry rabbitmq repo
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  - name:  install rabbitmq server
    package:
      name:  rabbitmq-server
      state: present
  - name: start and enable rabbitmq-server
    service:
      name: rabbitmq-server
      start: started
      enabled: yes
      
    

    



